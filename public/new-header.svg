<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 300" width="1920" height="300" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#151c2e"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="300" fill="url(#bg-grad)"/>

  <!-- Background Lighting & Accents -->
  <path d="M 0,150 H 1920" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,6" opacity="0.3"/>
  <circle cx="800" cy="150" r="150" fill="#38bdf8" opacity="0.025" filter="url(#glow-cyan)"/>

  <!-- LEFT SECTION: Elevated Name & Subtitle (Avoids Avatar at y > 100) -->
  <g transform="translate(40, 0)">
    <text x="0" y="55" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="1">DRAGOLJUB</text>
    <text x="0" y="82" fill="#38bdf8" font-size="16" font-weight="600">Senior Full-Stack Web Developer</text>
    <text x="0" y="102" fill="#94a3b8" font-size="12" font-weight="500">15+ Years Professional Experience</text>
  </g>

  <!-- DIVIDER 1 -->
  <line x1="450" y1="30" x2="450" y2="270" stroke="#334155" stroke-width="1"/>

  <!-- MIDDLE SECTION: TECH STACK & HIGHLIGHTS (Centered & Fully Visible) -->
  <g transform="translate(480, 0)">
    <!-- Core Value Statement -->
    <text x="0" y="45" fill="#34d399" font-size="12" font-weight="700" letter-spacing="1">SCALABLE WEB ARCHITECTURE • APIs • CLOUD &amp; WEB3</text>

    <!-- Row 1: Core Tech & Languages -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="80" height="28" rx="6" fill="rgba(247, 223, 30, 0.12)" stroke="#F7DF1E" stroke-width="1.2"/><text x="40" y="18" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">JavaScript</text>
      <rect x="86" y="0" width="82" height="28" rx="6" fill="rgba(49, 120, 198, 0.12)" stroke="#3178C6" stroke-width="1.2"/><text x="127" y="18" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">TypeScript</text>
      <rect x="174" y="0" width="48" height="28" rx="6" fill="rgba(136, 146, 191, 0.12)" stroke="#8892BF" stroke-width="1.2"/><text x="198" y="18" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">PHP</text>
      <rect x="228" y="0" width="65" height="28" rx="6" fill="rgba(95, 160, 78, 0.12)" stroke="#5FA04E" stroke-width="1.2"/><text x="260" y="18" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">Node.js</text>
      <rect x="299" y="0" width="60" height="28" rx="6" fill="rgba(65, 184, 131, 0.12)" stroke="#41B883" stroke-width="1.2"/><text x="329" y="18" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">Vue.js</text>
      <rect x="365" y="0" width="58" height="28" rx="6" fill="rgba(97, 218, 251, 0.12)" stroke="#61DAFB" stroke-width="1.2"/><text x="394" y="18" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">React</text>
      <rect x="429" y="0" width="60" height="28" rx="6" fill="rgba(226, 232, 240, 0.12)" stroke="#E2E8F0" stroke-width="1.2"/><text x="459" y="18" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">Next.js</text>
      <rect x="495" y="0" width="65" height="28" rx="6" fill="rgba(221, 0, 49, 0.12)" stroke="#DD0031" stroke-width="1.2"/><text x="527" y="18" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">Angular</text>
      <rect x="566" y="0" width="65" height="28" rx="6" fill="rgba(255, 45, 32, 0.12)" stroke="#FF2D20" stroke-width="1.2"/><text x="598" y="18" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">Laravel</text>
      <rect x="637" y="0" width="62" height="28" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1.2"/><text x="668" y="18" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">Python</text>
      <rect x="705" y="0" width="42" height="28" rx="6" fill="rgba(0, 173, 216, 0.12)" stroke="#00ADD8" stroke-width="1.2"/><text x="726" y="18" fill="#f8fafc" font-size="11" font-weight="500" text-anchor="middle">Go</text>
    </g>

    <!-- Row 2: Cloud, Databases & Frameworks -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="52" height="28" rx="6" fill="rgba(255, 153, 0, 0.12)" stroke="#FF9900" stroke-width="1.2"/><text x="26" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">AWS</text>
      <rect x="58" y="0" width="65" height="28" rx="6" fill="rgba(36, 150, 237, 0.12)" stroke="#2496ED" stroke-width="1.2"/><text x="90" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">Docker</text>
      <rect x="129" y="0" width="76" height="28" rx="6" fill="rgba(62, 207, 142, 0.12)" stroke="#3ECF8E" stroke-width="1.2"/><text x="167" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">Supabase</text>
      <rect x="211" y="0" width="88" height="28" rx="6" fill="rgba(65, 105, 225, 0.12)" stroke="#4169E1" stroke-width="1.2"/><text x="255" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">PostgreSQL</text>
      <rect x="305" y="0" width="76" height="28" rx="6" fill="rgba(71, 162, 72, 0.12)" stroke="#47A248" stroke-width="1.2"/><text x="343" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">MongoDB</text>
      <rect x="387" y="0" width="72" height="28" rx="6" fill="rgba(225, 0, 152, 0.12)" stroke="#E10098" stroke-width="1.2"/><text x="423" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">GraphQL</text>
      <rect x="465" y="0" width="78" height="28" rx="6" fill="rgba(168, 85, 247, 0.12)" stroke="#A855F7" stroke-width="1.2"/><text x="504" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">REST APIs</text>
      <rect x="549" y="0" width="68" height="28" rx="6" fill="rgba(6, 182, 212, 0.12)" stroke="#06B6D4" stroke-width="1.2"/><text x="583" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">Tailwind</text>
      <rect x="623" y="0" width="94" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1.2"/><text x="670" y="18" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">React Native</text>
    </g>

    <!-- Row 3: Specialized Domains & Workflows -->
    <g transform="translate(0, 138)">
      <rect x="0" y="0" width="150" height="28" rx="6" fill="rgba(236, 72, 153, 0.12)" stroke="#EC4899" stroke-width="1.2"/><text x="75" y="18" fill="#f8fafc" font-size="10.5" font-weight="600" text-anchor="middle">3D / WebGL (Three.js)</text>
      <rect x="156" y="0" width="135" height="28" rx="6" fill="rgba(139, 92, 246, 0.12)" stroke="#8B5CF6" stroke-width="1.2"/><text x="223" y="18" fill="#f8fafc" font-size="10.5" font-weight="600" text-anchor="middle">Web3 / Solidity</text>
      <rect x="297" y="0" width="168" height="28" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1.2"/><text x="381" y="18" fill="#f8fafc" font-size="10.5" font-weight="600" text-anchor="middle">AI Integration &amp; Workflows</text>
      <rect x="471" y="0" width="120" height="28" rx="6" fill="rgba(249, 115, 22, 0.12)" stroke="#F97316" stroke-width="1.2"/><text x="531" y="18" fill="#f8fafc" font-size="10.5" font-weight="600" text-anchor="middle">CI/CD &amp; DevOps</text>
      <rect x="597" y="0" width="82" height="28" rx="6" fill="rgba(244, 63, 94, 0.12)" stroke="#F43F5E" stroke-width="1.2"/><text x="638" y="18" fill="#f8fafc" font-size="10.5" font-weight="600" text-anchor="middle">Git &amp; Jira</text>
    </g>
  </g>

  <!-- DIVIDER 2 -->
  <line x1="1350" y1="30" x2="1350" y2="270" stroke="#334155" stroke-width="1"/>

  <!-- RIGHT SECTION: Top-Half Elevated (Avoids Freelancer UI Buttons at y > 160) -->
  <g transform="translate(1380, 0)">
    <text x="0" y="45" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">WHY WORK WITH ME</text>

    <!-- Value Bullet Points -->
    <text x="0" y="70" fill="#f1f5f9" font-size="12" font-weight="500">
      <tspan fill="#34d399">✓</tspan> Clean, maintainable &amp; production-ready code
    </text>
    <text x="0" y="90" fill="#f1f5f9" font-size="12" font-weight="500">
      <tspan fill="#34d399">✓</tspan> Full ownership from architecture to cloud deployment
    </text>

    <!-- Action Badges (Placed side-by-side in safe upper region) -->
    <g transform="translate(0, 110)">
      <!-- Badge 1: Availability -->
      <rect x="0" y="0" width="235" height="34" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.2"/>
      <circle cx="16" cy="17" r="4" fill="#34d399"/>
      <text x="28" y="21" fill="#34d399" font-size="11.5" font-weight="700">Available Immediately</text>

      <!-- Badge 2: Flexible Milestones -->
      <rect x="245" y="0" width="245" height="34" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1.2"/>
      <polygon points="261,13 265,17 261,21 257,17" fill="#38bdf8"/>
      <text x="272" y="21" fill="#38bdf8" font-size="11.5" font-weight="700">Flexible on Milestones</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="star-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="star-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle ambient halo -->
  <circle cx="256" cy="256" r="140" fill="#4f46e5" opacity="0.18" filter="url(#glow)"/>

  <!-- Outer 8-point geometric star -->
  <polygon points="256,64 296,216 448,256 296,296 256,448 216,296 64,256 216,216" fill="url(#star-outer)"/>

  <!-- Inner 4-point directional core -->
  <polygon points="256,120 286,226 392,256 286,286 256,392 226,286 120,256 226,226" fill="url(#star-inner)"/>

  <!-- Center focus core -->
  <circle cx="256" cy="256" r="32" fill="#ffffff"/>
  <circle cx="256" cy="256" r="16" fill="#38bdf8"/>
</svg>

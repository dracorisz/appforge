name: Sync release metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-release-version.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Synchronize package metadata
        run: node scripts/set-version.mjs 1.26.0
      - name: Verify lock metadata
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!==l.version || p.version!==l.packages[''].version) process.exit(1)"
      - name: Commit generated lock metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Release metadata already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Sync release metadata to v1.26.0'
          git push

name: Temporary commerce cleanup

on:
  push:
    branches: [codex/backlog-public-apps]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[commerce-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/backlog-public-apps
          fetch-depth: 0

      - name: Remove legacy commerce properties from workspace seed
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/types/index.ts')
          lines = path.read_text().splitlines(True)
          exact = {
              '  price: string\n',
              '  channels: string[]\n',
          }
          out = []
          for line in lines:
              stripped = line.strip()
              if line in exact:
                  continue
              if line.startswith('    price:'):
                  continue
              if line.startswith('    channels:'):
                  continue
              out.append(line)
          path.write_text(''.join(out))
          PY

      - name: Commit transformed seed
        run: |
          if git diff --quiet -- src/types/index.ts; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/index.ts
          git commit -m "chore: remove legacy mini-app commerce fields [commerce-cleanup]"
          git push origin HEAD:codex/backlog-public-apps

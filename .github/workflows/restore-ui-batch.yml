name: Restore UI batch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/restore-ui-batch.py'
      - '.github/scripts/fix-ui-batch2.py'
      - '.github/workflows/restore-ui-batch.yml'

permissions:
  contents: write

jobs:
  restore-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply recovered batch
        run: |
          python3 .github/scripts/restore-ui-batch.py
          python3 .github/scripts/fix-ui-batch2.py
      - name: Install dependencies
        run: npm ci
      - name: Verify release
        run: |
          npm run check:ui-style
          npm run verify:release
      - name: Commit verified batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete UI consistency and settings batch"
          git push origin HEAD:main

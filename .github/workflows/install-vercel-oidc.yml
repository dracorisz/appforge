name: Install Vercel OIDC dependency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-vercel-oidc.yml'

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Vercel OIDC helper
        run: npm install @vercel/oidc --save-exact
      - name: Commit dependency metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Add Vercel OIDC helper for Google federation'
          git push

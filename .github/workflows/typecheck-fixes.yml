name: Temporary typecheck fixes

on:
  push:
    branches: [codex/backlog-public-apps]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[typecheck-fixes]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/backlog-public-apps
          fetch-depth: 0

      - name: Apply compiler fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          replace(
              'src/components/dashboard/PF_ScrapperProNext.tsx',
              "Promise.resolve({ ok: true, results: [] as ScrapperProResult[], nextPageToken: null })",
              "Promise.resolve({ ok: true, results: [] as ScrapperProResult[], nextPageToken: null, error: undefined } as YouTubeResponse)",
          )

          replace(
              'src/components/public/FaviconStudio.tsx',
              "const escapeXml = (value: string) => value\n  .replaceAll('&', '&amp;')\n  .replaceAll('<', '&lt;')\n  .replaceAll('>', '&gt;')\n  .replaceAll('\\\"', '&quot;')\n  .replaceAll(\"'\", '&apos;')",
              "const escapeXml = (value: string) => value\n  .replace(/&/g, '&amp;')\n  .replace(/</g, '&lt;')\n  .replace(/>/g, '&gt;')\n  .replace(/\\\"/g, '&quot;')\n  .replace(/'/g, '&apos;')",
          )

          replace(
              'src/components/public/LandingBuilder.tsx',
              "const escapeHtml = (value: string) => value.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('\\\"', '&quot;')",
              "const escapeHtml = (value: string) => value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\\\"/g, '&quot;')",
          )

          replace(
              'src/components/resources/MarketingStudio.tsx',
              "import { CheckCircle2, Clipboard, ExternalLink, Film, RefreshCw, Save, Send, Youtube } from 'lucide-react'",
              "import { CheckCircle2, Clipboard, ExternalLink, Film, Send, Youtube } from 'lucide-react'",
          )

          replace(
              'src/components/resources/MarketingStudio.tsx',
              "  const markPublished = (record: PublicationRecord) => {\n    if (!record.remoteUrl.trim()) {\n      setMessage('Add the published YouTube URL before marking the publication complete.')\n      return\n    }\n    const videoIdMatch = record.remoteUrl.match(/(?:v=|youtu\\.be\\/|shorts\\/)([A-Za-z0-9_-]{6,})/)\n    updatePublication(record.id, { status: 'published', remoteId: videoIdMatch?.[1] || record.remoteId, publishedAt: new Date().toISOString(), attempts: Math.max(record.attempts, 1) })\n    if (selectedDemo) updateDemo(selectedDemo.id, { status: 'published', publishedUrl: record.remoteUrl })",
              "  const markPublished = (record: PublicationRecord) => {\n    const remoteUrl = (record.remoteUrl || '').trim()\n    if (!remoteUrl) {\n      setMessage('Add the published YouTube URL before marking the publication complete.')\n      return\n    }\n    const videoIdMatch = remoteUrl.match(/(?:v=|youtu\\.be\\/|shorts\\/)([A-Za-z0-9_-]{6,})/)\n    updatePublication(record.id, { status: 'published', remoteId: videoIdMatch?.[1] || record.remoteId, remoteUrl, publishedAt: new Date().toISOString(), attempts: Math.max(record.attempts, 1) })\n    if (selectedDemo) updateDemo(selectedDemo.id, { status: 'published', publishedUrl: remoteUrl })",
          )

          replace('.github/workflows/ci.yml', 'node-version: 20', 'node-version: 22')
          PY

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/PF_ScrapperProNext.tsx src/components/public/FaviconStudio.tsx src/components/public/LandingBuilder.tsx src/components/resources/MarketingStudio.tsx .github/workflows/ci.yml
          git commit -m "fix: resolve integration typecheck errors [typecheck-fixes]"
          git push origin HEAD:codex/backlog-public-apps

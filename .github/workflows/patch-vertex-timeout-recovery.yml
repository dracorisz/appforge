name: Patch Vertex timeout recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-vertex-timeout-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep ambiguous worker timeouts recoverable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api/desktop-buddy-vertex.js')
          text = path.read_text()
          old = "      const mapped = publicError(workerError)\n      await patchJob(token, bridgeJobId, user.id, { status: mapped.status >= 500 ? 'failed' : 'running', error_code: mapped.code }).catch(() => undefined)\n      throw workerError\n"
          new = "      const mapped = publicError(workerError)\n      const errorName = String(workerError?.name || '').toLowerCase()\n      const errorMessage = String(workerError?.message || '').toLowerCase()\n      const ambiguousTimeout = errorName.includes('abort') || errorName.includes('timeout') || errorMessage.includes('abort') || errorMessage.includes('timeout')\n      await patchJob(token, bridgeJobId, user.id, { status: ambiguousTimeout ? 'running' : 'failed', error_code: mapped.code }).catch(() => undefined)\n      throw workerError\n"
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Vertex worker catch anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/desktop-buddy-vertex.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep ambiguous Vertex timeouts recoverable'
          git push

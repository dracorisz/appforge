name: Patch Apps canonical redirect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-apps-canonical-redirect.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Redirect signed-out workspace Apps to public Explore
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = "  if (!user && !loading && location.pathname === '/apps') return lazyPage(<PublicAppsPage />)\n"
          new = "  if (!user && !loading && location.pathname === '/apps') return <Navigate to=\"/explore\" replace />\n"
          if new not in text:
              if old not in text: raise SystemExit('signed-out apps route anchor missing')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Canonicalize public Apps directory at explore'
          git push

name: Sync AppForge 1.27.1 metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-version-1.27.1.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Normalize package metadata
        shell: bash
        run: |
          set -euo pipefail
          node scripts/set-version.mjs 1.27.1
          if git diff --quiet -- package.json package-lock.json; then
            echo "Package metadata already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sync package metadata to 1.27.1"
          git push

name: Button cleanup once

on:
  push:
    branches: [main]
    paths:
      - scripts/cleanup-button-classnames.mjs
      - .github/workflows/button-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/cleanup-button-classnames.mjs
      - name: Commit cleanup
        run: |
          if git diff --quiet -- src; then
            echo "No Button cleanup changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "refactor: remove redundant button class overrides"
          git push origin HEAD:main

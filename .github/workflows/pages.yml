name: GitHub Pages Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install VitePress for docs build
        run: npm install --no-save --no-package-lock vitepress@1.6.4

      - name: Build VitePress documentation
        run: npx vitepress build docs

      - name: Verify custom-domain artifact paths
        run: |
          test -f docs/.vitepress/dist/index.html
          test -f docs/.vitepress/dist/favicon.svg
          test -d docs/.vitepress/dist/assets
          if grep -R -nE '(src|href)="/appforge/' docs/.vitepress/dist --include='*.html'; then
            echo 'Custom-domain build contains stale /appforge/ asset or navigation paths.' >&2
            exit 1
          fi
          grep -q 'href="/favicon.svg"' docs/.vitepress/dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

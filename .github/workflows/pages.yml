name: GitHub Pages Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DOCS_OUT_DIR: docs/.vitepress/dist

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --legacy-peer-deps

      - name: Install VitePress for docs build
        run: npm install --no-save --no-package-lock --legacy-peer-deps vitepress@1.6.4

      - name: Build VitePress documentation
        run: npx vitepress build docs --outDir "$DOCS_OUT_DIR"

      - name: Verify documentation artifact
        run: |
          test -f "$DOCS_OUT_DIR/index.html"
          test -f "$DOCS_OUT_DIR/favicon.svg"
          test -d "$DOCS_OUT_DIR/assets"
          if grep -R -nE '(src|href)="/appforge/' "$DOCS_OUT_DIR" --include='*.html'; then
            echo 'Documentation build contains stale /appforge/ paths.' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

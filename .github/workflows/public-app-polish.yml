name: Public app polish batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-app-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Correct source patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/public-apps-polish.py')
          text = p.read_text()
          text = text.replace("type ViewMode = 'list' | 'grid' ", "type ViewMode = 'list' | 'grid'")
          text = text.replace("type Filter = 'all' | 'active' | 'completed' ", "type Filter = 'all' | 'active' | 'completed'")
          p.write_text(text)
          PY
      - run: python .github/scripts/public-apps-polish.py
      - run: npm ci
      - run: npm run verify:release
      - run: npx vitepress build docs
      - name: Commit verified batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: advance all public app workflows" || true
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:main || true

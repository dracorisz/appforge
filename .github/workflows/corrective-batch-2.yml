name: Corrective Batch 2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/corrective-batch-2.py'
      - '.github/workflows/corrective-batch-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply corrective batch
        run: python .github/scripts/corrective-batch-2.py
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify release
        run: npm run verify:release
      - name: Verify docs
        run: |
          npm install --no-save vitepress
          npx vitepress build docs
      - name: Commit batch
        run: |
          git config user.name 'appforge-batch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete second corrective UI and docs batch'
          git push origin HEAD:main

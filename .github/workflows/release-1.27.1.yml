name: Publish AppForge 1.27.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-1.27.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate and publish 1.27.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/changelog.mjs validate
          node scripts/changelog.mjs extract 1.27.1 release-notes.md
          TARGET_SHA="$(git rev-parse "${GITHUB_SHA}^")"
          if git rev-parse v1.27.1 >/dev/null 2>&1; then
            echo "Tag v1.27.1 already exists."
          else
            git tag v1.27.1 "$TARGET_SHA"
            git push origin v1.27.1
          fi
          if gh release view v1.27.1 >/dev/null 2>&1; then
            gh release edit v1.27.1 --title "AppForge 1.27.1" --notes-file release-notes.md
          else
            gh release create v1.27.1 --title "AppForge 1.27.1" --notes-file release-notes.md --verify-tag
          fi

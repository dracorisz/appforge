name: Sync v1.27 release metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-release-1-27.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Synchronize package and lock metadata
        run: node scripts/set-version.mjs 1.27.0
      - name: Verify metadata
        run: node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='1.27.0'||l.version!==p.version||l.packages[''].version!==p.version)process.exit(1)"
      - name: Commit generated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bump AppForge release metadata to v1.27.0'
          git push

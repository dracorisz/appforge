name: Design normalization materializer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'chore(design): materialize typography normalization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create normalized Git commit object
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/materialize-design-normalization.mjs

name: Patch Vertex Settings status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-vertex-settings-status.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add safe Vertex status to Integrations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/resources/Settings.tsx')
          text = path.read_text()
          import_anchor = "import { createWorkspaceBackup, parseWorkspaceBackup, type WorkspaceImportPreview } from '@/lib/workspaceBackup'\n"
          import_line = "import { VertexBridgeStatus } from './VertexBridgeStatus'\n"
          if import_line not in text:
              if import_anchor not in text: raise SystemExit('Settings import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          marker = "          </Card>\n        </div>\n      )}\n\n      {activeTab === 'deployment'"
          replacement = "          </Card>\n          <VertexBridgeStatus />\n        </div>\n      )}\n\n      {activeTab === 'deployment'"
          if '<VertexBridgeStatus />' not in text:
              if marker not in text: raise SystemExit('Integrations closing anchor missing')
              text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/resources/Settings.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show safe Vertex bridge status in Integrations'
          git push

name: Patch public Apps front

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-public-apps-front.yml'

permissions:
  contents: write

jobs:
  patch:
    # One-shot routing patch; remove after the generated commit lands.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire signed-out Apps directory and landing link
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          anchor = "const LandingBuilder = React.lazy(() => import('./components/public/LandingBuilder'))\n"
          line = "const PublicAppsPage = React.lazy(() => import('./components/public/PublicAppsPage').then((module) => ({ default: module.PublicAppsPage })))\n"
          if line not in text:
              if anchor not in text: raise SystemExit('App lazy import anchor missing')
              text = text.replace(anchor, anchor + line, 1)
          route_anchor = "  if (location.pathname === '/login') return <LoginPage />\n"
          route_line = "  if (!user && !loading && location.pathname === '/apps') return lazyPage(<PublicAppsPage />)\n"
          if route_line not in text:
              if route_anchor not in text: raise SystemExit('App public route anchor missing')
              text = text.replace(route_anchor, route_anchor + route_line, 1)
          app.write_text(text)

          login = Path('src/auth/LoginPage.tsx')
          text = login.read_text()
          text = text.replace("const DOCS_URL = 'https://dracorisz.github.io/appforge/'", "const DOCS_URL = 'https://docs.sstoken.space/'")
          changelog = "            <a href={CHANGELOG_URL} target=\"_blank\" rel=\"noopener noreferrer\" className=\"inline-flex h-9 items-center gap-2 rounded-lg border border-border/70 bg-background/70 px-3 text-xs font-semibold text-muted-foreground transition-colors hover:border-foreground/25 hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background\">\n"
          apps_link = "            <Link to=\"/apps\" className=\"inline-flex h-9 items-center gap-2 rounded-lg border border-border/70 bg-background/70 px-3 text-xs font-semibold text-muted-foreground transition-colors hover:border-foreground/25 hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background\"><span>Apps</span></Link>\n"
          if apps_link not in text:
              if changelog not in text: raise SystemExit('Login header anchor missing')
              text = text.replace(changelog, apps_link + changelog, 1)
          login.write_text(text)
          PY
      - name: Commit front routing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/auth/LoginPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Expose public Apps directory from landing'
          git push

name: Patch Vertex client idempotency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-vertex-client-idempotency.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Persist Vertex idempotency key before network request
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/dashboard/DesktopBuddyProviderLab.tsx')
          text = path.read_text()

          key_anchor = "const VERTEX_RECOVERY_KEY = 'appforge-desktop-buddy-vertex-job'\n"
          key_line = "const VERTEX_REQUEST_KEY = 'appforge-desktop-buddy-vertex-request'\n"
          if key_line not in text:
              if key_anchor not in text: raise SystemExit('Vertex recovery key anchor missing')
              text = text.replace(key_anchor, key_anchor + key_line, 1)

          state_anchor = "  const [lastVertexJob, setLastVertexJob] = React.useState(() => localStorage.getItem(VERTEX_RECOVERY_KEY) || '')\n"
          state_line = "  const [pendingVertexRequest, setPendingVertexRequest] = React.useState(() => localStorage.getItem(VERTEX_REQUEST_KEY) || '')\n"
          if state_line not in text:
              if state_anchor not in text: raise SystemExit('Vertex job state anchor missing')
              text = text.replace(state_anchor, state_anchor + state_line, 1)

          old_generate = "    const clientRequestId = crypto.randomUUID()\n    const response = await fetch('/api/desktop-buddy-vertex', {\n"
          new_generate = "    const clientRequestId = pendingVertexRequest || crypto.randomUUID()\n    if (!pendingVertexRequest) {\n      localStorage.setItem(VERTEX_REQUEST_KEY, clientRequestId)\n      setPendingVertexRequest(clientRequestId)\n    }\n    const response = await fetch('/api/desktop-buddy-vertex', {\n"
          if new_generate not in text:
              if old_generate not in text: raise SystemExit('Vertex generate request anchor missing')
              text = text.replace(old_generate, new_generate, 1)

          complete_anchor = "    if (payload.status && payload.status !== 'complete') throw new Error(`Vertex job is ${payload.status}. Use Recover Vertex job instead of starting another paid request.`)\n    acceptResult(payload, 'vertex')\n"
          complete_new = "    if (payload.status === 'failed') {\n      localStorage.removeItem(VERTEX_REQUEST_KEY)\n      setPendingVertexRequest('')\n      throw new Error('Vertex job failed. The next Generate action may safely start a new request.')\n    }\n    if (payload.status && payload.status !== 'complete') throw new Error(`Vertex job is ${payload.status}. Use Recover Vertex job instead of starting another paid request.`)\n    localStorage.removeItem(VERTEX_REQUEST_KEY)\n    setPendingVertexRequest('')\n    acceptResult(payload, 'vertex')\n"
          if complete_new not in text:
              if complete_anchor not in text: raise SystemExit('Vertex complete anchor missing')
              text = text.replace(complete_anchor, complete_new, 1)

          recover_anchor = "      if (payload.status !== 'complete') throw new Error(`Vertex job is ${payload.status || 'still running'}. Try recovery again later; do not start a duplicate request.`)\n      acceptResult(payload, 'vertex')\n"
          recover_new = "      if (payload.status === 'failed') {\n        localStorage.removeItem(VERTEX_REQUEST_KEY)\n        setPendingVertexRequest('')\n        throw new Error('The existing Vertex job failed. The next Generate action may safely start a new request.')\n      }\n      if (payload.status !== 'complete') throw new Error(`Vertex job is ${payload.status || 'still running'}. Try recovery again later; do not start a duplicate request.`)\n      localStorage.removeItem(VERTEX_REQUEST_KEY)\n      setPendingVertexRequest('')\n      acceptResult(payload, 'vertex')\n"
          if recover_new not in text:
              if recover_anchor not in text: raise SystemExit('Vertex recovery anchor missing')
              text = text.replace(recover_anchor, recover_new, 1)

          status_anchor = "          <p className=\"text-xs leading-5 text-muted-foreground\">{provider === 'vertex' ? 'Vertex jobs are owner-scoped and idempotent. Recovery checks the existing Cloud Run job instead of starting another paid image.' : hfStatus?.sharedQuota || 'Explicit request only; no automatic retry.'}</p>\n"
          status_new = "          <p className=\"text-xs leading-5 text-muted-foreground\">{provider === 'vertex' ? pendingVertexRequest ? 'A Vertex request key is pending. Generate will safely replay that same request until it resolves; recovery never starts a second paid image.' : 'Vertex jobs are owner-scoped and idempotent. Recovery checks the existing Cloud Run job instead of starting another paid image.' : hfStatus?.sharedQuota || 'Explicit request only; no automatic retry.'}</p>\n"
          if status_new not in text:
              if status_anchor not in text: raise SystemExit('Vertex status copy anchor missing')
              text = text.replace(status_anchor, status_new, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/dashboard/DesktopBuddyProviderLab.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Persist Vertex idempotency key across browser timeouts'
          git push

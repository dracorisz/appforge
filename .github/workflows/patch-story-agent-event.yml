name: Patch Story Studio agent event

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-story-agent-event.yml'

permissions:
  contents: write

jobs:
  patch:
    # One-shot maintenance patch; remove this workflow after the generated commit lands.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire shared response event
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/dashboard/PF_AIDragonArenaStudio.tsx')
          text = path.read_text()
          import_anchor = "import { getGeminiHeaders } from '@/lib/aiProviders'\n"
          import_line = "import { emitAgentResponse } from '@/lib/agentEvents'\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('AI provider import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          event_anchor = "      setHistory((current) => [...current, { role: 'gm', text: narrative }])\n"
          event_line = "      emitAgentResponse(narrative, 'story-studio')\n"
          if event_line not in text:
              if event_anchor not in text:
                  raise SystemExit('Story response anchor not found')
              text = text.replace(event_anchor, event_anchor + event_line, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- src/components/dashboard/PF_AIDragonArenaStudio.tsx; then
            echo 'Story Studio agent event already wired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/dashboard/PF_AIDragonArenaStudio.tsx
          git commit -m 'Emit Story Studio responses to Desktop Buddy'
          git push

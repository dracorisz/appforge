name: UI uniformity materializer

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-ui-uniformity.mjs
      - scripts/ui-uniformity-trigger.txt

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/apply-ui-uniformity.mjs
      - name: Final generated-tree cleanup
        run: |
          sed -i 's/px-0 //g' src/components/layout/Sidebar.tsx
          sed -i 's/ px-0"/"/g' src/components/layout/Sidebar.tsx
      - name: Verify generated tree
        run: |
          npm run check:ui-style
          npm run typecheck
          npm test
          npm run build
      - name: Publish verified commit object
        run: |
          git config user.name "appforge-design-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src tailwind.config.js scripts/check-ui-style.mjs docs/DESIGN_SYSTEM.md
          git commit -m "refactor(ui): standardize controls and layout"
          git tag ui-uniformity-materialized-20260914
          git push origin refs/tags/ui-uniformity-materialized-20260914

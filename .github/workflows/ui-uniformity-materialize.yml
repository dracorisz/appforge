name: UI uniformity materializer

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-ui-uniformity.mjs

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/apply-ui-uniformity.mjs
      - name: Commit materialized UI changes
        run: |
          git config user.name "appforge-design-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src tailwind.config.js scripts/check-ui-style.mjs docs/DESIGN_SYSTEM.md
          if git diff --cached --quiet; then
            echo "No UI changes to commit."
            exit 0
          fi
          git commit -m "refactor(ui): standardize controls and layout"
          git push origin HEAD:main

name: UI uniformity materializer

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-ui-uniformity.mjs
      - scripts/ui-uniformity-trigger.txt

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/apply-ui-uniformity.mjs
      - name: Package generated tree
        run: |
          tar -czf /tmp/ui-uniformity-generated.tgz src tailwind.config.js scripts/check-ui-style.mjs docs/DESIGN_SYSTEM.md
      - uses: actions/upload-artifact@v4
        with:
          name: ui-uniformity-generated
          path: /tmp/ui-uniformity-generated.tgz
          retention-days: 1

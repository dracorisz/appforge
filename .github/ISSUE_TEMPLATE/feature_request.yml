name: Feature request
description: Propose a new AppForge tool or a focused improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Existing app improvement
        - New mini-app
        - Shared UI / UX
        - Auth / profiles / admin
        - API / backend
        - Documentation / contributor tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need before proposing implementation details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Keep the change focused and consistent with AppForge shared patterns.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: References / screenshots / implementation notes

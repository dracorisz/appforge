name: Bug report
description: Report a reproducible problem in AppForge
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AppForge. Please include the build fingerprint shown in the footer.
  - type: input
    id: app
    attributes:
      label: App / route
      placeholder: /apps/scrapper-pro
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build fingerprint
      placeholder: v1.18.0 · abc1234 · Sep 08, 21:00 UTC
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Browser / screenshots / notes

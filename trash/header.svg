<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 300" width="1920" height="300" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1920" height="300" fill="url(#bg-grad)"/>

  <!-- Subtle Decorative Grid Lines -->
  <path d="M0,75 H1920 M0,150 H1920 M0,225 H1920" stroke="#334155" stroke-width="1" stroke-dasharray="4,8" opacity="0.4"/>
  <path d="M400,0 V300 M960,0 V300 M1450,0 V300" stroke="#334155" stroke-width="1" stroke-dasharray="4,8" opacity="0.3"/>

  <!-- Glowing Tech Accent Circles -->
  <circle cx="100" cy="50" r="120" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>
  <circle cx="1800" cy="250" r="150" fill="#818cf8" opacity="0.05" filter="url(#glow)"/>

  <!-- Left Column: Name & Main Title -->
  <text x="80" y="85" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="3">15+ YEARS EXPERIENCE</text>
  <text x="80" y="135" fill="#ffffff" font-size="42" font-weight="800" letter-spacing="1">DRAGOLJUB</text>
  <text x="80" y="170" fill="#94a3b8" font-size="20" font-weight="500">Senior Full-Stack Web Developer &amp; Technical Consultant</text>
  
  <!-- Experience Badge -->
  <rect x="80" y="195" width="310" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="235" y="218" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">Scalable Architecture • APIs • DevOps</text>

  <!-- Middle Divider -->
  <line x1="470" y1="50" x2="470" y2="250" stroke="#334155" stroke-width="1.5"/>

  <!-- Center Column: Core Tech Stack -->
  <text x="510" y="75" fill="#e2e8f0" font-size="16" font-weight="700" letter-spacing="1">CORE TECH STACK</text>
  
  <!-- Tech Stack Pills - Row 1 -->
  <g transform="translate(510, 100)">
    <rect x="0" y="0" width="110" height="30" rx="6" fill="#1e293b" stroke="#475569"/><text x="55" y="19" fill="#f8fafc" font-size="13" text-anchor="middle">JavaScript</text>
    <rect x="120" y="0" width="80" height="30" rx="6" fill="#1e293b" stroke="#475569"/><text x="160" y="19" fill="#f8fafc" font-size="13" text-anchor="middle">PHP</text>
    <rect x="210" y="0" width="90" height="30" rx="6" fill="#1e293b" stroke="#475569"/><text x="255" y="19" fill="#f8fafc" font-size="13" text-anchor="middle">Vue.js</text>
    <rect x="310" y="0" width="90" height="30" rx="6" fill="#1e293b" stroke="#475569"/><text x="355" y="19" fill="#f8fafc" font-size="13" text-anchor="middle">React</text>
    <rect x="410" y="0" width="100" height="30" rx="6" fill="#1e293b" stroke="#475569"/><text x="460" y="19" fill="#f8fafc" font-size="13" text-anchor="middle">Laravel</text>
  </g>

  <!-- Tech Stack Pills - Row 2 -->
  <g transform="translate(510, 145)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="#1e293b" stroke="#475569"/><text x="40" y="19" fill="#cbd5e1" font-size="13" text-anchor="middle">AWS</text>
    <rect x="90" y="0" width="90" height="30" rx="6" fill="#1e293b" stroke="#475569"/><text x="135" y="19" fill="#cbd5e1" font-size="13" text-anchor="middle">Docker</text>
    <rect x="190" y="0" width="110" height="30" rx="6" fill="#1e293b" stroke="#475569"/><text x="245" y="19" fill="#cbd5e1" font-size="13" text-anchor="middle">Supabase</text>
    <rect x="310" y="0" width="110" height="30" rx="6" fill="#1e293b" stroke="#475569"/><text x="365" y="19" fill="#cbd5e1" font-size="13" text-anchor="middle">PostgreSQL</text>
    <rect x="430" y="0" width="110" height="30" rx="6" fill="#1e293b" stroke="#475569"/><text x="485" y="19" fill="#cbd5e1" font-size="13" text-anchor="middle">REST APIs</text>
  </g>

  <!-- Tech Stack Pills - Row 3 -->
  <g transform="translate(510, 190)">
    <rect x="0" y="0" width="140" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/><text x="70" y="19" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">3D / WebGL (Three.js)</text>
    <rect x="150" y="0" width="150" height="30" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1"/><text x="225" y="19" fill="#818cf8" font-size="12" font-weight="600" text-anchor="middle">Blockchain / Web3</text>
    <rect x="310" y="0" width="140" height="30" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/><text x="380" y="19" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">AI &amp; Automation</text>
  </g>

  <!-- Middle Right Divider -->
  <line x1="1120" y1="50" x2="1120" y2="250" stroke="#334155" stroke-width="1.5"/>

  <!-- Right Column: Value Highlights & Availability -->
  <g transform="translate(1160, 0)">
    <text x="0" y="75" fill="#e2e8f0" font-size="16" font-weight="700" letter-spacing="1">WHY WORK WITH ME</text>
    
    <text x="0" y="115" fill="#34d399" font-size="15" font-weight="700">✓ <tspan fill="#e2e8f0" font-weight="400">Clean, maintainable &amp; production-ready code</tspan></text>
    <text x="0" y="145" fill="#34d399" font-size="15" font-weight="700">✓ <tspan fill="#e2e8f0" font-weight="400">Full ownership from architecture to cloud deployment</tspan></text>
    <text x="0" y="175" fill="#34d399" font-size="15" font-weight="700">✓ <tspan fill="#e2e8f0" font-weight="400">Clear communication &amp; fast response times</tspan></text>

    <!-- Availability Banner -->
    <rect x="0" y="200" width="320" height="36" rx="6" fill="#0284c7" opacity="0.2"/>
    <rect x="0" y="200" width="320" height="36" rx="6" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="20" cy="218" r="5" fill="#34d399"/>
    <text x="35" y="223" fill="#38bdf8" font-size="13" font-weight="700">Available to start immediately</text>
  </g>
</svg>

openapi: 3.0.3
info:
  title: crypto-logo.com API
  version: 1.0.0
  description: Free cryptocurrency logo API. Download pre-generated logo derivatives
    in PNG, SVG, WebP, JPEG, ICO.
paths:
  /api/asset/{file_path}:
    get:
      operationId: asset_retrieve
      description: Serves logo variant and history files from the assets directory.
        Used for alternate logo designs and historical versions.
      summary: Get asset file
      parameters:
      - in: path
        name: file_path
        schema:
          type: string
        description: Path to asset file (e.g., versions/bitcoin-btc-full.svg)
        required: true
      tags:
      - Data
      responses:
        '200':
          content: {}
          description: ''
  /api/coins.json:
    get:
      operationId: coins.json_list
      description: Returns a JSON array of all active coins with metadata for building
        search interfaces.
      summary: List all coins
      tags:
      - Data
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoinList'
          description: ''
  /api/logo/{slug}.{fmt}:
    get:
      operationId: logo_._retrieve
      description: Returns a pre-generated logo derivative from media/cache. If the
        requested derivative isn't pre-generated, returns 404.
      summary: Get coin logo image
      parameters:
      - in: query
        name: bg
        schema:
          type: string
        description: 'Background hex color without # (e.g., FFFFFF)'
      - in: path
        name: fmt
        schema:
          type: string
        description: 'Output format: png, svg, webp, jpeg, ico'
        required: true
      - in: query
        name: h
        schema:
          type: integer
        description: Output height in pixels
      - in: query
        name: size
        schema:
          type: integer
        description: ICO size shorthand (sets both w and h)
      - in: path
        name: slug
        schema:
          type: string
        description: Coin identifier (e.g., bitcoin-btc)
        required: true
      - in: query
        name: w
        schema:
          type: integer
        description: Output width in pixels
      tags:
      - Logo
      responses:
        '200':
          content: {}
          description: ''
components:
  schemas:
    CoinList:
      type: object
      properties:
        name:
          type: string
        ticker:
          type: string
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        has_png:
          type: boolean
        has_svg:
          type: boolean
        search_terms:
          type: array
          items:
            type: string
        market_cap_rank:
          type: integer
          nullable: true
      required:
      - has_png
      - has_svg
      - market_cap_rank
      - name
      - search_terms
      - slug
      - ticker
tags:
- name: Logo
  description: Dynamic logo image serving with resize and format conversion
- name: Data
  description: Coin metadata and asset files
